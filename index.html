<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Colours: change them here if you ever want to */
:root{--bg:#07060d;--ink:#f3f1fa;--mute:#aaa6c2;--main:#8f7bff;--c1:#ff6b8b;--c2:#ffb457;--c3:#3ee0c5;--c4:#4aa8ff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;line-height:1.08}
a{color:inherit}
:focus-visible{outline:2px solid var(--c3);outline-offset:3px}
.mute{color:var(--mute)}

/* One continuous background. It starts as a small circle, then grows to fill the page. */
.bg{--r:120px;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#0b0916;clip-path:circle(var(--r) at 50% 50%);transition:clip-path 1.8s cubic-bezier(.75,0,.15,1)}
body.open .bg{clip-path:circle(150vmax at 50% 50%)}
.bg i{position:absolute;width:85vmax;height:85vmax;border-radius:50%;background:radial-gradient(circle,var(--k),transparent 65%);will-change:transform}
.bg i:nth-child(1){--k:rgba(255,107,139,.75);left:-20vmax;top:-25vmax;animation:a1 22s ease-in-out infinite alternate}
.bg i:nth-child(2){--k:rgba(143,123,255,.8);right:-25vmax;top:0;animation:a2 26s ease-in-out infinite alternate}
.bg i:nth-child(3){--k:rgba(74,168,255,.7);left:5vmax;bottom:-45vmax;animation:a3 30s ease-in-out infinite alternate}
.bg i:nth-child(4){--k:rgba(255,180,87,.55);right:0;bottom:-40vmax;animation:a1 34s ease-in-out infinite alternate-reverse}
.bg i:nth-child(5){--k:rgba(62,224,197,.4);left:30vmax;top:15vmax;animation:a2 38s ease-in-out infinite alternate-reverse}
.bg::after{content:"";position:absolute;inset:0;background:rgba(7,6,13,.4)}
@keyframes a1{to{transform:translate3d(30vmax,25vmax,0) scale(1.15)}}
@keyframes a2{to{transform:translate3d(-28vmax,30vmax,0) scale(.9)}}
@keyframes a3{to{transform:translate3d(25vmax,-22vmax,0) scale(1.2)}}

/* opening circle */
.intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;cursor:pointer;transition:opacity .8s .5s}
.ring{width:240px;height:240px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 0 70px rgba(143,123,255,.55);animation:breathe 3.4s ease-in-out infinite;transition:transform 1.2s cubic-bezier(.75,0,.15,1),opacity .8s}
.ring img{width:110px;height:110px;object-fit:contain}
.ring b{font:700 84px Sora,sans-serif}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 100px rgba(143,123,255,.85)}}
.hint{position:absolute;bottom:11vh;font-size:14px;color:var(--mute);letter-spacing:.08em;transition:opacity .4s}
body.open .intro{opacity:0;pointer-events:none}
body.open .ring{transform:scale(1.7);opacity:0;animation:none}
body.open .hint{opacity:0}

/* corner logo, language switch, text menu */
.mark,.lang,.menu{position:fixed;z-index:40;opacity:0;pointer-events:none;transition:opacity .8s 1.3s}
body.open .mark,body.open .lang,body.open .menu{opacity:1;pointer-events:auto}
.mark{left:26px;top:20px;text-decoration:none}
.mark img{height:34px;display:block}
.mark b{font:700 26px Sora,sans-serif}
.lang{top:18px;right:22px;display:flex;gap:3px;padding:4px;border:1px solid rgba(255,255,255,.14);border-radius:99px;background:rgba(12,10,22,.7);backdrop-filter:blur(16px)}
.lang button{border:0;border-radius:99px;padding:7px 11px;background:none;color:var(--mute);font:600 11px Inter,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--main);color:#0b0818}
.menu{left:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.menu a{font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#7f7b98;transition:color .3s;width:max-content}
.menu a:hover{color:var(--ink)}
.menu a.on{color:var(--c2);text-shadow:0 0 14px rgba(255,180,87,.5)}

/* sections are transparent so the background is never cut */
main,footer{position:relative;z-index:2;opacity:0;transition:opacity 1s 1.1s}
body.open main,body.open footer{opacity:1}
.sec{min-height:100svh;display:flex;align-items:center;padding:110px 90px 110px 170px}
.wrap{width:100%;max-width:1100px}
.rv{opacity:0;transform:translateY(32px);transition:opacity .9s ease var(--d,0s),transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}
.kicker{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:20px}
h1{font-size:clamp(42px,6.2vw,90px);font-weight:700}
h2{font-size:clamp(32px,4.2vw,56px);font-weight:600;max-width:820px}
h3{font-size:20px;font-weight:600;margin-bottom:8px}
.lead{color:var(--mute);font-size:19px;max-width:640px;margin-top:24px}
.long{max-width:720px;margin-top:24px;color:var(--mute)}
.long p+p{margin-top:14px}
.shine{background:linear-gradient(100deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--main),var(--c1));background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:240% 0}}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-block;padding:14px 26px;border-radius:99px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);backdrop-filter:blur(10px);transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(143,123,255,.6)}
.btn.p{background:var(--main);border-color:transparent;color:#0b0818;font-weight:600}
.chip{font-size:12px;padding:7px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.16);color:var(--mute);background:rgba(255,255,255,.04)}

/* glass cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:48px}
.card{position:relative;overflow:hidden;padding:26px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);transition:border-color .3s,box-shadow .4s,transform .4s}
.card::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none;background:radial-gradient(320px circle at var(--mx,50%) var(--my,0),rgba(143,123,255,.35),transparent 62%)}
.card:hover{border-color:rgba(143,123,255,.7);box-shadow:0 24px 70px -22px var(--main);transform:translateY(-6px)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.card p{color:var(--mute);font-size:15px}
.tag{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c2);margin-bottom:10px}

/* project slider */
.slider{margin:44px -90px 0 -170px;padding:18px 0;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.slider.grab{cursor:grabbing}
.track{display:flex;width:max-content;will-change:transform}
.track .card{flex:none;width:380px;margin-right:22px;padding:0;cursor:pointer}
.track .txt{padding:0 24px 24px}
.media{height:230px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,rgba(143,123,255,.45),rgba(255,107,139,.3));color:rgba(255,255,255,.7);font-size:13px;margin-bottom:20px;pointer-events:none}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.more{display:inline-block;margin-top:14px;font-weight:500;font-size:14px;color:var(--c2);text-decoration:none}
.hintline a{color:var(--c2)}

/* skills */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px;margin-top:40px}
.groups h3{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0}
.chips li{position:relative;padding:9px 15px;border:1px solid rgba(255,255,255,.16);border-radius:99px;font-size:14.5px;line-height:1.4;color:var(--mute);background:rgba(255,255,255,.05);backdrop-filter:blur(8px);transition:transform .25s,border-color .25s,color .25s,background .25s}
.chips li.has-tip{cursor:help}
.chips li:hover,.chips li:focus{transform:translateY(-3px);border-color:rgba(74,168,255,.5);color:var(--ink);background:rgba(74,168,255,.1);outline:none}
.tip{position:absolute;left:50%;bottom:calc(100% + 12px);z-index:30;transform:translate(-50%,5px);width:max-content;max-width:min(260px,75vw);padding:10px 14px;border-radius:12px;background:rgba(20,25,43,.85);backdrop-filter:blur(18px);color:var(--ink);font-size:12.5px;line-height:1.4;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,transform .2s,visibility .2s;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.has-tip:hover .tip,.has-tip:focus .tip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.note{margin-top:22px;color:var(--mute);font-style:italic;font-size:15px}

/* journey steps, contact, footer */
.stages{list-style:none;padding:0;margin-top:44px;max-width:760px}
.stages li{position:relative;padding:0 0 34px 34px;border-left:2px solid rgba(255,255,255,.2);margin-left:8px}
.stages li:last-child{padding-bottom:0}
.stages li::before{content:"";position:absolute;left:-10px;top:4px;width:18px;height:18px;border-radius:50%;border:2px solid var(--c2);background:#120d1c}
.stages .when{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c2)}
.contact h2{font-size:clamp(2.4rem,7vw,5.4rem)}
footer{padding:30px 90px 36px 170px;color:var(--mute);font-size:13px}

/* project page: grows out of the card, then reads like its own page */
html.noscroll,html.noscroll body{overflow:hidden}
.proj{position:fixed;inset:0;z-index:60;overflow-y:auto;overscroll-behavior:contain;background:#0d0a18;color:var(--ink);clip-path:inset(0 round 0);transition:clip-path .78s cubic-bezier(.7,0,.15,1)}
.proj[hidden]{display:none}
.proj .fade{opacity:0;transition:opacity .6s .45s}
.proj.live .fade{opacity:1}
.pbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(13,10,24,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:14px;color:var(--mute)}
.pback{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--ink);padding:8px 16px;border-radius:99px;font:500 14px Inter,sans-serif;cursor:pointer;transition:border-color .2s}
.pback:hover{border-color:var(--c2)}
.phero{position:relative;min-height:68vh;display:flex;align-items:flex-end;margin-top:-58px;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(255,107,139,.5),transparent 55%),radial-gradient(circle at 85% 30%,rgba(143,123,255,.6),transparent 55%),#120d1c}
.pcover{position:absolute;inset:0}
.pcover img,.pcover video{width:100%;height:100%;object-fit:cover;display:block}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#0d0a18)}
.ptitle{position:relative;z-index:2;width:100%;max-width:1040px;margin:0 auto;padding:120px 32px 44px}
.ptitle h1{font-size:clamp(2.4rem,7vw,5.6rem);margin:6px 0 14px}
.ptitle p{max-width:620px;font-size:19px;color:rgba(243,241,250,.8)}
.pmeta{max-width:1040px;margin:0 auto;padding:6px 32px 8px;display:flex;flex-wrap:wrap;gap:12px 48px}
.pmeta div{display:flex;flex-direction:column}
.pmeta span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.pmeta b{font-weight:500;font-size:16px}
.pbody{max-width:1040px;margin:0 auto;padding:40px 32px;display:flex;flex-direction:column;gap:60px}
.b-h{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:600;max-width:760px}
.b-t{max-width:720px;font-size:18.5px;line-height:1.8;color:rgba(243,241,250,.82)}
.b-t p+p{margin-top:16px}
.b-q{font:600 clamp(1.4rem,3vw,2.1rem)/1.3 Sora,sans-serif;max-width:800px;padding-left:24px;border-left:3px solid var(--c2)}
.b-q cite{display:block;margin-top:12px;font:400 15px Inter,sans-serif;color:var(--mute);font-style:normal}
.b-f img,.b-f video,.b-sp img,.b-sp video,.b-g img,.b-g video{width:100%;display:block;border-radius:18px}
.b-v iframe,.b-v video{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000;display:block}
figcaption{margin-top:10px;font-size:14px;color:var(--mute)}
.b-s{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.b-s div{padding:24px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.b-s b{display:block;font:700 clamp(2.2rem,5vw,3.4rem)/1 Sora,sans-serif;color:var(--c2);margin-bottom:8px}
.b-s span{color:var(--mute);font-size:15px}
.b-sp{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.b-sp.flip .b-t{order:2}
.b-g{columns:2 300px;column-gap:14px}
.b-g>*{display:block;break-inside:avoid;margin:0 0 14px}
.pnext{display:block;width:100%;max-width:1040px;margin:30px auto 0;padding:56px 32px 80px;background:none;border:0;border-top:1px solid rgba(255,255,255,.12);color:inherit;text-align:left;cursor:pointer;font:inherit}
.pnext span{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.pnext b{font:700 clamp(1.8rem,5vw,3.4rem) Sora,sans-serif;transition:color .3s}
.pnext:hover b{color:var(--c2)}
@media(max-width:700px){.b-sp{grid-template-columns:1fr}.b-sp.flip .b-t{order:0}.ptitle,.pmeta,.pbody,.pnext{padding-left:20px;padding-right:20px}.pbody{gap:44px}}

@media(max-width:900px){.sec{padding:100px 24px 90px 56px}.grid{grid-template-columns:1fr}.slider{margin:36px -24px 0 -56px}.track .card{width:290px}footer{padding:26px 24px 30px 56px}}
@media(max-width:700px){.sec{padding:90px 20px 80px 44px}.slider{margin:30px -20px 0 -44px}.bg{--r:95px}.ring{width:190px;height:190px}.mark{left:14px}.lang{right:12px;top:12px}
  .menu{left:12px;gap:8px}.menu a{font-size:0;line-height:0}.menu a::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor}
  .menu a.on{font-size:10px;line-height:1.2;writing-mode:vertical-rl}.menu a.on::before{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}html{scroll-behavior:auto}.rv{transform:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="intro" id="intro" role="button" tabindex="0" aria-label="Open the portfolio"><div class="ring" id="ring"></div><p class="hint" id="hint"></p></div>
<a class="mark" id="mark" href="#home" aria-label="Back to top"></a>
<div class="lang" id="lang" role="group" aria-label="Language"></div>
<nav class="menu" id="menu" aria-label="Sections"></nav>
<main id="main"></main>
<footer id="footer"></footer>
<div class="proj" id="proj" role="dialog" aria-modal="true" aria-label="Project" hidden></div>

<!-- All text, projects and skills live in content.js. You never need to edit this file. -->
<script src="content.js"></script>
<script>
(function(){
var C=window.SITE;
if(!C){document.body.innerHTML='<p style="padding:40px;color:#fff">content.js is missing or has a typo. Check your last edit to it.</p>';return}
var $=function(s){return document.querySelector(s)},root=document.documentElement;
var lang=C.defaultLanguage||'en';try{lang=localStorage.getItem('pf-lang')||lang}catch(e){}
if(!C.languages.some(function(l){return l.code===lang}))lang=C.languages[0].code;

/* t() picks the text for the current language and falls back to another one, so nothing is ever blank */
function t(v){
  if(v==null)return '';if(typeof v==='string')return v;
  if(v[lang]!=null&&v[lang]!=='')return v[lang];
  for(var i=0;i<C.languages.length;i++){var x=v[C.languages[i].code];if(x!=null&&x!=='')return x}
  return '';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function paras(v){return t(v).split(/\n\s*\n/).map(function(p){return '<p>'+esc(p.trim())+'</p>'}).join('')}
function rich(v){return esc(t(v)).replace(/\*\*(.+?)\*\*/g,'<span class="shine">$1</span>')}
function media(src,alt){
  if(!src)return '';
  if(/\.(mp4|webm|mov)$/i.test(src))return '<video src="'+esc(src)+'" muted loop playsinline autoplay></video>';
  return '<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy">';
}
function logo(){return C.logo?'<img src="'+esc(C.logo)+'" alt="">':'<b>'+esc(C.name.charAt(0))+'</b>'}
function sec(id,nav,inner){return '<section class="sec" id="'+id+'" data-nav="'+esc(t(C.ui.nav[nav]))+'"><div class="wrap">'+inner+'</div></section>'}
function head(S,d){return '<span class="kicker rv">'+esc(t(S.kicker))+'</span><h2 class="rv">'+rich(S.title)+'</h2>'}

function build(){
  var S=C.sections,L=C.links,U=C.ui,h='';
  document.title=C.name+' | '+t(C.role);root.lang=lang;
  $('#ring').innerHTML=logo();$('#mark').innerHTML=logo();$('#hint').textContent=t(U.hint);
  $('#lang').innerHTML=C.languages.map(function(l){return '<button type="button" data-l="'+l.code+'" aria-pressed="'+(l.code===lang)+'">'+esc(l.label)+'</button>'}).join('');

  h+=sec('home','home','<span class="kicker rv">'+esc(C.name)+' · '+esc(t(C.location))+'</span><h1 class="rv" style="--d:.1s">'+rich(S.home.title)+'</h1><p class="lead rv" style="--d:.2s">'+esc(t(S.home.lead))+'</p>'
    +'<div class="row rv" style="--d:.3s"><a class="btn p" href="#projects">'+esc(t(S.home.button1))+'</a><a class="btn" href="#contact">'+esc(t(S.home.button2))+'</a></div>'
    +'<div class="row rv" style="--d:.4s;gap:10px;margin-top:28px">'+S.home.chips.map(function(c){return '<span class="chip">'+esc(t(c))+'</span>'}).join('')+'</div>');

  h+=sec('journey','journey',head(S.journey)+'<div class="long rv">'+paras(S.journey.text)+'</div>'
    +(S.journey.steps&&S.journey.steps.length?'<ol class="stages rv">'+S.journey.steps.map(function(s){return '<li><span class="when">'+esc(t(s.when))+'</span><h3>'+esc(t(s.title))+'</h3><p class="mute">'+esc(t(s.text))+'</p></li>'}).join('')+'</ol>':''));

  h+=sec('expertise','expertise',head(S.expertise)+'<div class="grid">'+S.expertise.cards.map(function(c,i){return '<div class="card rv" style="--d:'+(i%3)*.1+'s"><h3>'+esc(t(c.title))+'</h3><p>'+esc(t(c.text))+'</p></div>'}).join('')+'</div>');

  var n=C.projects.length,k=Math.max(1,Math.ceil(innerWidth*1.3/(n*402))),P='';
  for(var j=0;j<k;j++)P+=C.projects.map(function(p,i){return '<div class="card" data-i="'+i+'"><div class="media">'+(p.image?media(p.image,t(p.title)):esc(t(U.mediaSoon)))+'</div><div class="txt"><span class="tag">'+esc(t(p.tag))+'</span><h3>'+esc(t(p.title))+'</h3><p>'+esc(t(p.summary))+'</p><span class="more">'+esc(t(U.viewProject))+' →</span></div></div>'}).join('');
  h+=sec('projects','projects',head(S.projects)+'<p class="lead hintline rv">'+esc(t(S.projects.hint))+(L.behance?' <a href="'+esc(L.behance)+'" target="_blank" rel="noopener">'+esc(t(S.projects.behanceText))+'</a>':'')+'</p><div class="slider rv" id="slider"><div class="track" id="track">'+P+P+'</div></div>');

  h+=sec('skills','skills',head(S.skills)+'<p class="lead rv">'+esc(t(S.skills.lead))+'</p><div class="groups">'+S.skills.groups.map(function(g,gi){
    return '<div class="rv" style="--d:'+gi*.12+'s"><h3>'+esc(t(g.title))+'</h3><ul class="chips">'+g.items.map(function(it){var tip=t(it.tip).trim();return '<li'+(tip?' class="has-tip" tabindex="0"':'')+'>'+esc(t(it.name))+(tip?'<span class="tip">'+esc(tip)+'</span>':'')+'</li>'}).join('')+'</ul>'+(g.note?'<p class="note">'+esc(t(g.note))+'</p>':'')+'</div>'}).join('')+'</div>');

  var B=U.buttons,b='';
  if(L.email)b+='<a class="btn p" href="mailto:'+esc(L.email)+'">'+esc(t(B.email))+'</a>';
  if(L.phone)b+='<a class="btn" href="tel:'+esc(L.phone)+'">'+esc(t(B.phone))+'</a>';
  [['behance','behance'],['linkedin','linkedin']].forEach(function(x){if(L[x[0]])b+='<a class="btn" href="'+esc(L[x[0]])+'" target="_blank" rel="noopener">'+esc(t(B[x[1]]))+'</a>'});
  var cv=t(L.cv);if(cv)b+='<a class="btn" href="'+esc(cv)+'" download>'+esc(t(B.cv))+'</a>';
  h+=sec('contact','contact',head(S.contact)+'<p class="lead rv">'+esc(t(S.contact.lead))+'</p><div class="row rv">'+b+'</div>').replace('class="sec"','class="sec contact"');

  $('#main').innerHTML=h;$('#footer').textContent=t(C.footer);
  $('#menu').innerHTML=[].map.call(document.querySelectorAll('.sec'),function(s){return '<a href="#'+s.id+'">'+esc(s.dataset.nav)+'</a>'}).join('');
  watch();slider();
}

/* project page */
var proj=$('#proj'),from=null,closing=false;
var MT=(C.ui&&C.ui.meta)||{company:{fr:'Entreprise',en:'Company'},role:{fr:'Rôle',en:'Role'},year:{fr:'Année',en:'Year'},tools:{fr:'Outils',en:'Tools'}};
var BK=(C.ui&&C.ui.back)||{fr:'Retour',en:'Back'},NX=(C.ui&&C.ui.next)||{fr:'Projet suivant',en:'Next project'};
function clip(el){var r=el.getBoundingClientRect(),w=innerWidth,h=innerHeight;return 'inset('+Math.max(0,r.top)+'px '+Math.max(0,w-r.right)+'px '+Math.max(0,h-r.bottom)+'px '+Math.max(0,r.left)+'px round 22px)'}
function vid(v,ti){var id=(v.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[])[1];return id?'<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allowfullscreen loading="lazy" title="'+esc(ti)+'"></iframe>':'<video src="'+esc(v)+'" controls playsinline></video>'}
function cap(x){var c=t(x);return c?'<figcaption>'+esc(c)+'</figcaption>':''}
function block(b){
  var y=b.type;
  if(y==='heading')return '<h3 class="rv b-h">'+esc(t(b.text))+'</h3>';
  if(y==='text')return '<div class="rv b-t">'+paras(b.text)+'</div>';
  if(y==='quote')return '<blockquote class="rv b-q">'+esc(t(b.text))+(b.by?'<cite>'+esc(t(b.by))+'</cite>':'')+'</blockquote>';
  if(y==='image')return b.src?'<figure class="rv b-f">'+media(b.src,t(b.caption))+cap(b.caption)+'</figure>':'';
  if(y==='video')return b.src?'<figure class="rv b-f b-v">'+vid(b.src,t(b.caption))+cap(b.caption)+'</figure>':'';
  if(y==='stats')return '<div class="rv b-s">'+(b.items||[]).map(function(s){return '<div><b>'+esc(t(s.fig))+'</b><span>'+esc(t(s.label))+'</span></div>'}).join('')+'</div>';
  if(y==='split')return b.src?'<div class="rv b-sp'+(b.flip?' flip':'')+'"><div class="b-t">'+paras(b.text)+'</div><figure>'+media(b.src,t(b.caption))+cap(b.caption)+'</figure></div>':'<div class="rv b-t">'+paras(b.text)+'</div>';
  if(y==='link')return b.url?'<p class="rv"><a class="btn p" href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(t(b.label)||t(C.ui.openLink))+' ↗</a></p>':'';
  if(y==='gallery'){var it=(b.items||[]).map(function(g){return typeof g==='string'?{src:g}:g}).filter(function(g){return g.src});
    return it.length?'<div class="rv b-g">'+it.map(function(g){var f='<figure>'+media(g.src,t(g.caption))+cap(g.caption)+'</figure>';return g.link?'<a href="'+esc(g.link)+'" target="_blank" rel="noopener">'+f+'</a>':f}).join('')+'</div>':''}
  return '';
}
function page(p,i){
  var cv=p.cover||p.image,bl=(p.blocks||[]).slice(),n=C.projects.length;
  if(!p.blocks){if(p.video)bl.push({type:'video',src:p.video});if(p.description)bl.push({type:'text',text:p.description});if((p.gallery||[]).length)bl.push({type:'gallery',items:p.gallery});if(p.link)bl.push({type:'link',url:p.link})}
  var meta=[['company',p.company],['role',p.role],['year',p.year],['tools',p.tools]].map(function(m){var v=m[1];if(Array.isArray(v))v=v.join(', ');v=t(v);return v?'<div><span>'+esc(t(MT[m[0]]))+'</span><b>'+esc(v)+'</b></div>':''}).join('');
  return '<div class="pbar"><button class="pback" type="button">← '+esc(t(BK))+'</button><span>'+esc(t(p.title))+'</span></div>'
   +'<header class="phero"><div class="pcover">'+(cv?media(cv,t(p.title)):'')+'</div><div class="ptitle fade"><span class="tag">'+esc(t(p.tag))+'</span><h1>'+esc(t(p.title))+'</h1><p>'+esc(t(p.summary))+'</p></div></header>'
   +(meta?'<div class="pmeta fade">'+meta+'</div>':'')+'<div class="pbody">'+bl.map(block).join('')+'</div>'
   +(n>1?'<button class="pnext" type="button" data-next="'+((i+1)%n)+'"><span>'+esc(t(NX))+'</span><b>'+esc(t(C.projects[(i+1)%n].title))+' →</b></button>':'');
}
function reveal(){var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in')})},{root:proj,threshold:.1});proj.querySelectorAll('.rv').forEach(function(el){o.observe(el)})}
function openProject(i,el){
  from=el;proj.innerHTML=page(C.projects[i],i);proj.hidden=false;proj.scrollTop=0;
  proj.style.transition='none';proj.style.clipPath=clip(el);proj.classList.remove('live');void proj.offsetWidth;
  proj.style.transition='';proj.style.clipPath='inset(0px 0px 0px 0px round 0px)';proj.classList.add('live');
  root.classList.add('noscroll');history.pushState({p:i},'');reveal();
  var b=proj.querySelector('.pback');if(b)b.focus({preventScroll:true});
}
function closeProject(){
  if(proj.hidden||closing)return;closing=true;proj.classList.remove('live');
  proj.style.clipPath=from&&document.contains(from)?clip(from):'inset(50% 50% 50% 50% round 22px)';
  setTimeout(function(){proj.hidden=true;proj.innerHTML='';root.classList.remove('noscroll');closing=false},780);
}
function requestClose(){if(history.state&&history.state.p!=null)history.back();else closeProject()}
addEventListener('popstate',closeProject);
addEventListener('keydown',function(e){if(e.key==='Escape'&&!proj.hidden)requestClose()});
proj.addEventListener('click',function(e){
  if(e.target.closest('.pback'))requestClose();
  var n=e.target.closest('[data-next]');
  if(n){var j=+n.dataset.next;from=document.querySelector('.track .card[data-i="'+j+'"]')||from;proj.innerHTML=page(C.projects[j],j);proj.scrollTop=0;proj.classList.add('live');history.replaceState({p:j},'');reveal()}
});

var io;
function watch(){
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in')})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});setActive();
}
function setActive(){
  var cur=0,s=document.querySelectorAll('.sec'),l=document.querySelectorAll('#menu a');
  s.forEach(function(x,i){if(x.getBoundingClientRect().top<=innerHeight*.5)cur=i});
  l.forEach(function(x,i){x.classList.toggle('on',i===cur)});
}
addEventListener('scroll',function(){requestAnimationFrame(setActive)},{passive:true});
document.addEventListener('mousemove',function(e){var c=e.target.closest&&e.target.closest('.card');if(!c)return;var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});

/* slider: drifts slowly, calms down when you hover, drag it to move it */
var raf;
function slider(){
  cancelAnimationFrame(raf);
  var sl=$('#slider'),tr=$('#track');if(!sl)return;
  var x=0,v=-.45,base=matchMedia('(prefers-reduced-motion:reduce)').matches?0:-.45,drag=false,hov=false,lx=0,moved=0;
  (function loop(){
    var per=tr.scrollWidth/2;
    if(!drag){v+=((hov?base*.15:base)-v)*.04;x+=v}
    if(per>0)x=((x%per)-per)%per;
    tr.style.transform='translate3d('+x+'px,0,0)';raf=requestAnimationFrame(loop);
  })();
  sl.onmouseenter=function(){hov=true};sl.onmouseleave=function(){hov=false};
  sl.onpointerdown=function(e){drag=true;lx=e.clientX;v=0;moved=0;sl.classList.add('grab')};
  sl.onpointermove=function(e){if(!drag)return;var d=e.clientX-lx;lx=e.clientX;x+=d;v=d;moved+=Math.abs(d)};
  var up=function(){drag=false;sl.classList.remove('grab')};
  sl.onpointerup=up;sl.onpointercancel=up;sl.onpointerleave=function(){if(drag)up()};
  sl.onclick=function(e){if(moved>6)return;var c=e.target.closest('.card');if(c)openProject(+c.dataset.i,c)};
}

/* opening: the circle grows into the background */
root.classList.add('lock');var opened=false;
function open(){if(opened)return;opened=true;document.body.classList.add('open');setTimeout(function(){root.classList.remove('lock')},1500)}
['click','wheel','touchstart','keydown'].forEach(function(ev){addEventListener(ev,function(e){
  if(ev==='keydown'&&['Tab','Shift','Control','Alt','Meta'].indexOf(e.key)>-1)return;open()},{passive:true})});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#lang button');
  if(b){lang=b.dataset.l;try{localStorage.setItem('pf-lang',lang)}catch(x){}build()}});
build();
})();
</script>
</body>
